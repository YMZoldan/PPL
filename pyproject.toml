[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-unified-platform"
version = "0.1.0"
description = "Unified MSP platform MVP: RMM, EDR, Backup, Remote Control, PSA and Accounting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "sqlmodel>=0.0.22"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[tool.setuptools]
packages = ["app", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
